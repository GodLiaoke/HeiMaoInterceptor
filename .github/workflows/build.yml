name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build HeiMaoInterceptor
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HeiMaoInterceptor.xcodeproj \
            -scheme HeiMaoInterceptor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HeiMaoInterceptor.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            -quiet

      - name: Package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/HeiMaoInterceptor.xcarchive/Products/Applications/HeiMaoInterceptor.app"
          if [ ! -d "$APP" ]; then
            echo "app not found, listing archive:"
            find "$RUNNER_TEMP/HeiMaoInterceptor.xcarchive" -maxdepth 4 -type d
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry HeiMaoInterceptor.ipa Payload
          ls -lh HeiMaoInterceptor.ipa
          unzip -l HeiMaoInterceptor.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeiMaoInterceptor-ipa
          path: ${{ runner.temp }}/HeiMaoInterceptor.ipa
          if-no-files-found: error
          retention-days: 30
