name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.runner }})
    # 同时挂三种 macOS 机型抢机器：GitHub 免费机器池排队紧张时，
    # 谁先被分配到 runner 谁就编，其余任务编完/取消都不影响产物。
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel, macos-26-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          sw_vers

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          ls -la Resources

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HeiMaoInterceptor.xcodeproj \
            -scheme HeiMaoInterceptor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HeiMaoInterceptor.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            -quiet

      - name: Package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/HeiMaoInterceptor.xcarchive/Products/Applications/HeiMaoInterceptor.app"
          if [ ! -d "$APP" ]; then
            echo "app not found, listing archive:"
            find "$RUNNER_TEMP/HeiMaoInterceptor.xcarchive" -maxdepth 4 -type d
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry HeiMaoInterceptor.ipa Payload
          ls -lh HeiMaoInterceptor.ipa
          unzip -l HeiMaoInterceptor.ipa | head -30
          echo "--- bundle check ---"
          ls -la "$APP"
          ls -la "$APP/PlugIns" || true
          test -f "$APP/rules.txt" && echo "rules.txt OK" || echo "rules.txt MISSING"

          # ---- 兼容性硬校验：必须支持 iOS 15 及以上（含 iOS 27）----
          MINOS_APP=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          MINOS_EXT=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/PlugIns/HeiMaoTunnel.appex/Info.plist" 2>/dev/null || echo "missing")
          echo "MinimumOSVersion app=$MINOS_APP ext=$MINOS_EXT"
          if [ "$MINOS_APP" != "15.0" ]; then
            echo "ERROR: App 最低系统版本必须为 15.0（当前 $MINOS_APP）"
            exit 1
          fi
          if [ "$MINOS_EXT" != "15.0" ]; then
            echo "ERROR: 隧道扩展最低系统版本必须为 15.0（当前 $MINOS_EXT）"
            exit 1
          fi
          echo "COMPAT_OK: iOS 15.0 起装，向上兼容 iOS 27"

          echo "IPA_SIZE=$(stat -f%z HeiMaoInterceptor.ipa)" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeiMaoInterceptor-ipa-${{ matrix.runner }}
          path: ${{ runner.temp }}/HeiMaoInterceptor.ipa
          if-no-files-found: error
          retention-days: 30
