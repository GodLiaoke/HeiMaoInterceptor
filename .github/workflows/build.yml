name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.runner }})
    # 同时挂三种 macOS 机型抢机器：GitHub 免费机器池排队紧张时，
    # 谁先被分配到 runner 谁就编，其余任务编完/取消都不影响产物。
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-15-intel, macos-26-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          sw_vers

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: Obfuscate strings
        run: |
          # 1.2.3：把安全核心里的字符串字面量换成运行时解码，二进制里 strings 不到原文
          python3 Tools/obfuscate_strings.py

      - name: Obfuscate symbols
        run: |
          # 类型名在构建副本上改成无意义短名，映射表只留在 runner 里（排查崩溃用）
          SYMBOL_MAP_PATH="$RUNNER_TEMP/symbol-map.txt" python3 Tools/rename_types.py
          echo "--- 混淆后自检：原类型名不应再出现在源码里 ---"
          for n in CryptoBox SecureChannel LicenseClient TunnelEngine RuleService DeviceIdentity; do
            if grep -rq "\b$n\b" Sources/ 2>/dev/null; then echo "SYMBOL_LEFT: $n"; fi
          done

      - name: Generate CRC seal
        run: |
          # 1.2.0：把每个源文件的 CRC32 写进 IntegritySeal（运行时逐层复算）
          # 必须在 rename_types 之后跑，否则改名后的内容与表里对不上
          python3 Tools/gen_crc.py
          grep -q "IntegritySeal" Sources/Shared/IntegritySeal.swift && echo CRC_SEAL_OK

      - name: Syntax pre-check
        run: |
          # 只做语法解析，不做类型检查：几秒钟就能拦住拼写/括号这类低级错误，
          # 免得四个 runner 一起排队十来分钟才发现一个括号问题
          fail=0
          for f in $(find Sources -name '*.swift'); do
            if ! swiftc -parse "$f" >/tmp/sc.log 2>&1; then
              echo "SYNTAX_FAIL: $f"
              cat /tmp/sc.log
              fail=1
            fi
          done
          [ "$fail" = "0" ] && echo "SYNTAX_OK"

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          ls -la Resources

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HeiMaoInterceptor.xcodeproj \
            -scheme HeiMaoInterceptor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HeiMaoInterceptor.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            -quiet

      - name: Package IPA
        run: |
          set -e
          ARCH_APP="$RUNNER_TEMP/HeiMaoInterceptor.xcarchive/Products/Applications/HeiMaoInterceptor.app"
          if [ ! -d "$ARCH_APP" ]; then
            echo "app not found, listing archive:"
            find "$RUNNER_TEMP/HeiMaoInterceptor.xcarchive" -maxdepth 4 -type d
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$ARCH_APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          # 后面所有裁剪与校验都必须针对「真正要打进 ipa 的这份」，
          # 之前误用了 archive 里那份，裁完 Payload 还是原样
          APP="$RUNNER_TEMP/Payload/HeiMaoInterceptor.app"
          echo "SEAL_APP=$APP" >> "$GITHUB_ENV"

          # ---- 去掉没有被引用的 Swift 兼容库 ----
          # Xcode 给 iOS14 目标的动态框架顺手塞了 libswift_Concurrency.dylib（7.7MB），
          # 但主程序/扩展/看门狗都没有链接它（otool -L 里查不到）。这类苹果自签的
          # 大体积 dylib 留在包里，第三方重签工具（ESign / 爱思）会直接报签名失败。
          BINS="$APP/HeiMaoInterceptor $APP/PlugIns/HeiMaoTunnel.appex/HeiMaoTunnel $APP/Frameworks/HMKit.framework/HMKit"
          if [ -d "$APP/Frameworks" ]; then
            # 先把每个二进制的依赖列出来，方便下回排查
            for b in $BINS; do
              [ -f "$b" ] || continue
              echo "DEPS $(basename "$b"):"
              otool -L "$b" 2>/dev/null | awk 'NR>1{print "  "$1}' || true
            done

            # 1) Swift 并发兼容库：这几个二进制都没用 async/await，直接去掉
            if [ -e "$APP/Frameworks/libswift_Concurrency.dylib" ]; then
              for b in $BINS; do
                [ -f "$b" ] || continue
                if otool -L "$b" 2>/dev/null | awk 'NR>1{print $1}' | grep -qxF "@rpath/libswift_Concurrency.dylib"; then
                  echo "REF_WARN: $b 依赖 libswift_Concurrency"
                fi
              done
              rm -f "$APP/Frameworks/libswift_Concurrency.dylib"
              echo "PRUNE: 删除 libswift_Concurrency.dylib"
            fi

            # 2) 其它 dylib：没有任何二进制依赖就删掉（精确匹配，别拿子串判断）
            for fw in "$APP"/Frameworks/*.dylib; do
              [ -e "$fw" ] || continue
              name=$(basename "$fw")
              used=0
              for b in $BINS; do
                [ -f "$b" ] || continue
                if otool -L "$b" 2>/dev/null | awk 'NR>1{print $1}' | grep -qxF "@rpath/$name"; then used=1; fi
              done
              if [ "$used" = "0" ]; then
                echo "PRUNE: 删除未引用的 $name"
                rm -f "$fw"
              else
                echo "KEEP: $name 被引用"
              fi
            done
          fi

          # 可执行权限兜底：巨魔 / 第三方签名器最怕这个位丢了
          find Payload -type f -perm -u+x -exec chmod 755 {} \;
          chmod 755 Payload/HeiMaoInterceptor.app/HeiMaoInterceptor
          chmod 755 Payload/HeiMaoInterceptor.app/PlugIns/HeiMaoTunnel.appex/HeiMaoTunnel

          # ---- 1.2.4 看门狗互校验：把构建期才知道的两个值写进二进制 ----
          # 主程序写「看门狗 __TEXT 段大小」，看门狗写「主程序 __TEXT 段哈希」。
          # 必须在签名之前做：签名只改 __LINKEDIT，不会破坏这里算出的哈希。
          # 任何一个占位符没写进去，后面 verify 步骤会直接 fail。
          python3 "$GITHUB_WORKSPACE/Tools/seal_binaries.py" "$APP"
          echo "SEAL_DONE"

          # 复核：看门狗里写的哈希必须等于主程序当前的 __TEXT 哈希
          python3 "$GITHUB_WORKSPACE/Tools/verify_seal.py" "$APP"

          zip -qryX HeiMaoInterceptor.ipa Payload
          ls -lh HeiMaoInterceptor.ipa
          unzip -l HeiMaoInterceptor.ipa | head -30

          echo "--- bundle check ---"
          ls -la "$APP"
          ls -la "$APP/PlugIns" || true
          test -f "$APP/rules.txt" && echo "rules.txt OK" || echo "rules.txt MISSING"
          if [ -d "$APP/Frameworks/HMKit.framework" ]; then
            echo "GUARD_OK: 看门狗框架已嵌入"
          else
            echo "ERROR: 看门狗框架缺失（主程序会因缺库启动失败）"
            exit 1
          fi

          # ---- 兼容性硬校验：必须支持 iOS 14 及以上（含 iOS 27）----
          MINOS_APP=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          MINOS_EXT=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/PlugIns/HeiMaoTunnel.appex/Info.plist" 2>/dev/null || echo "missing")
          echo "MinimumOSVersion app=$MINOS_APP ext=$MINOS_EXT"
          if [ "$MINOS_APP" != "14.0" ]; then
            echo "ERROR: App 最低系统版本必须为 14.0（当前 $MINOS_APP）"
            exit 1
          fi
          if [ "$MINOS_EXT" != "14.0" ]; then
            echo "ERROR: 隧道扩展最低系统版本必须为 14.0（当前 $MINOS_EXT）"
            exit 1
          fi
          echo "COMPAT_OK: iOS 14.0 起装，向上兼容 iOS 27"

          echo "--- Frameworks 内容 ---"
          ls -la "$APP/Frameworks" 2>/dev/null || echo "(无 Frameworks)"
          if [ -e "$APP/Frameworks/libswift_Concurrency.dylib" ]; then
            echo "PRUNE_FAIL: 未引用的 libswift_Concurrency.dylib 仍在包里"
            exit 1
          fi
          echo "PRUNE_OK: 包里没有多余的 Swift 兼容库"

          echo "IPA_SIZE=$(stat -f%z HeiMaoInterceptor.ipa)" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 预签名：巨魔 / 第三方签名器只签主二进制、漏掉 appex 时，
      # iOS 15+ 会直接拒绝整个 App（表现为“启动失败: permission denied”）。
      # 这里把 appex 与主二进制都签上，并带上 platform-application 与
      # NetworkExtension 权限，TrollStore 安装时会沿用这份 entitlements。
      # ---------------------------------------------------------------
      - name: Verify obfuscation in binary
        run: |
          set -o pipefail
          BIN="$RUNNER_TEMP/Payload/HeiMaoInterceptor.app/HeiMaoInterceptor"
          EXT="$RUNNER_TEMP/Payload/HeiMaoInterceptor.app/PlugIns/HeiMaoTunnel.appex/HeiMaoTunnel"
          OUT="$RUNNER_TEMP/obf-report.txt"
          : > "$OUT"

          echo "=== 敏感常量（明文出现即为失败）===" | tee -a "$OUT"
          strings -a "$BIN" > "$RUNNER_TEMP/bin.str" || true
          strings -a "$EXT" > "$RUNNER_TEMP/ext.str" || true
          HIT=0
          for k in "ef60b1af" "ios.ouovo" "HeiMao-Club-2026" "heimao-v3-salt" "heimao-salt-v1" "223.5.5.5"; do
            if grep -q "$k" "$RUNNER_TEMP/bin.str" "$RUNNER_TEMP/ext.str"; then
              echo "OBF_FAIL: 二进制里仍有 $k" | tee -a "$OUT"
              HIT=1
            fi
          done
          [ "$HIT" = "0" ] && echo "OBF_OK: 常量全部以密文形式存在" | tee -a "$OUT"

          echo "=== 类型名（可读即为失败）===" | tee -a "$OUT"
          SHIT=0
          for n in CryptoBox SecureChannel LicenseClient TunnelEngine RuleService DeviceIdentity AppConfig; do
            if grep -qw "$n" "$RUNNER_TEMP/bin.str"; then
              echo "SYMBOL_FAIL: 仍可读到 $n" | tee -a "$OUT"
              SHIT=1
            fi
          done
          [ "$SHIT" = "0" ] && echo "SYMBOL_OK: 自定义类型名已不可读" | tee -a "$OUT"

          echo "=== 关键结构仍在（混淆不能改坏功能）===" | tee -a "$OUT"
          grep -w "PacketTunnelProvider" "$RUNNER_TEMP/ext.str" | head -1 | tee -a "$OUT" || echo "WARN: 扩展类名未出现在字符串表（可能被 strip，正常）" | tee -a "$OUT"

          # 只报告不阻断：编译/签名/兼容性那几关才是硬门禁
          echo "OBF_REPORT_DONE"

      - name: Pre-sign for TrollStore
        run: |
          set -e
          APP="$RUNNER_TEMP/Payload/HeiMaoInterceptor.app"
          echo "SEAL_APP=$APP" >> "$GITHUB_ENV"
          APPEX="$APP/PlugIns/HeiMaoTunnel.appex"

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid || true
          fi
          if ! command -v ldid >/dev/null 2>&1; then
            ARCH=$(uname -m)
            if [ "$ARCH" = "arm64" ]; then A=arm64; else A=x86_64; fi
            curl -fL -o /tmp/ldid "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_${A}" || true
            if [ -s /tmp/ldid ]; then
              chmod +x /tmp/ldid
              sudo mv /tmp/ldid /usr/local/bin/ldid
            fi
          fi
          echo "ldid: $(command -v ldid || echo none)"
          ldid -h >/dev/null 2>&1 || true

          SIGN_LOG="$RUNNER_TEMP/sign.log"
          : > "$SIGN_LOG"

          # 说明：包里只留下真正被引用的嵌套二进制（libswift_Concurrency 已在打包阶段剔除）。
          # 剩下的看门狗框架由这里统一 ad-hoc 签名。

          # 内嵌的看门狗框架（1.2.3）：先签它，且必须在扩展与主程序之前
          FW="$APP/Frameworks/HMKit.framework"
          if [ -d "$FW" ]; then
            echo "guard framework found" | tee -a "$SIGN_LOG"
            # 优先用 codesign 签整个 framework bundle：会生成 _CodeSignature/CodeResources，
            # 第三方重签工具（ESign / 爱思）检查嵌套框架时更认这个结构
            if command -v codesign >/dev/null 2>&1 && codesign -f -s - --timestamp=none "$FW" >>"$SIGN_LOG" 2>&1; then
              echo "codesign framework OK" | tee -a "$SIGN_LOG"
            elif command -v ldid >/dev/null 2>&1; then
              ldid -S "$FW/HMKit" 2>&1 | tee -a "$SIGN_LOG"
            fi
            chmod 755 "$FW/HMKit"
            ls -la "$FW" | tee -a "$SIGN_LOG"
          else
            echo "WARN: HMKit.framework 未嵌入" | tee -a "$SIGN_LOG"
          fi

          if command -v ldid >/dev/null 2>&1; then
            # 从内到外签：先扩展，再主程序
            ldid -SResources/TrollStore-Tunnel.entitlements "$APPEX/HeiMaoTunnel" 2>&1 | tee -a "$SIGN_LOG"
            ldid -SResources/TrollStore-App.entitlements "$APP/HeiMaoInterceptor" 2>&1 | tee -a "$SIGN_LOG"
            echo "--- appex entitlements ---"
            ldid -e "$APPEX/HeiMaoTunnel" | tee -a "$SIGN_LOG"
            echo "--- app entitlements ---"
            ldid -e "$APP/HeiMaoInterceptor" | tee -a "$SIGN_LOG"
          else
            echo "ldid unavailable, falling back to ad-hoc codesign (结构签名, 不含受限权限)"
            codesign -f -s - --timestamp=none "$APPEX/HeiMaoTunnel"
            codesign -f -s - --timestamp=none "$APP/HeiMaoInterceptor"
            codesign -dv "$APP/HeiMaoInterceptor" 2>&1 | tee -a "$SIGN_LOG" || true
          fi

          # ldid -S 会重写文件、把权限重置成 644；iOS 加载扩展要求可执行位，这里补回来
          chmod 755 "$APPEX/HeiMaoTunnel" "$APP/HeiMaoInterceptor"

          # 重新打包（已签名版）
          cd "$RUNNER_TEMP"
          rm -f HeiMaoInterceptor-TrollStore.ipa
          zip -qryX HeiMaoInterceptor-TrollStore.ipa Payload
          ls -lh HeiMaoInterceptor-TrollStore.ipa

          # 执行位硬校验：丢一个就整包作废，别让 644 的扩展流出去
          BAD=$(unzip -Z HeiMaoInterceptor-TrollStore.ipa | grep -E "HeiMaoInterceptor$|HeiMaoTunnel$" | grep -v "^-rwxr-xr-x" || true)
          if [ -n "$BAD" ]; then
            echo "PERM_FAIL: 可执行位丢失 -> $BAD"
            exit 1
          fi
          unzip -Z HeiMaoInterceptor-TrollStore.ipa | grep -E "HeiMaoInterceptor$|HeiMaoTunnel$"
          echo "SIGN_PHASE_OK"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeiMaoInterceptor-ipa-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/HeiMaoInterceptor.ipa
            ${{ runner.temp }}/HeiMaoInterceptor-TrollStore.ipa
            ${{ runner.temp }}/sign.log
            ${{ runner.temp }}/symbol-map.txt
            ${{ runner.temp }}/obf-report.txt
          if-no-files-found: error
          retention-days: 30
