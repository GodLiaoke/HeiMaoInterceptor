name: HeiMaoInterceptor
options:
  bundleIdPrefix: com.heimao
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0.12"
    CURRENT_PROJECT_VERSION: "115"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # 产物去符号：符号表不进 ipa，class-dump / nm 拿不到可读结构
    STRIP_INSTALLED_PRODUCT: YES
    DEPLOYMENT_POSTPROCESSING: YES
    COPY_PHASE_STRIP: YES
    GCC_SYMBOLS_PRIVATE_EXTERN: YES
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  HeiMaoInterceptor:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heimao.interceptor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info-App.plist
        CODE_SIGN_ENTITLEMENTS: Resources/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: HeiMaoInterceptor
    dependencies:
      - target: HeiMaoTunnel
        embed: true
      - sdk: NetworkExtension.framework
      - sdk: Security.framework

  HeiMaoTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Tunnel
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heimao.interceptor.tunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_FILE: Resources/Info-Tunnel.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Tunnel.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: HeiMaoTunnel
    dependencies:
      - sdk: NetworkExtension.framework

schemes:
  HeiMaoInterceptor:
    build:
      targets:
        HeiMaoInterceptor: all
        HeiMaoTunnel: all
    run:
      config: Release
    archive:
      config: Release
